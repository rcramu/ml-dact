apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dact-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: CTP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dact-secrets
                  key: DATABASE_URL
            - name: CTP_MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: CTP_TRAIN_EPOCHS
              value: "120"
            - name: CTP_MINIMUM_F1
              value: "0.70"
            - name: CTP_MINIMUM_RECALL
              value: "0.60"
            - name: CTP_MINIMUM_PRECISION
              value: "0.60"
            - name: CTP_MAX_REGRESSION_PCT
              value: "10.0"
            - name: CTP_RANDOM_SEED
              value: "42"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dact
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30166

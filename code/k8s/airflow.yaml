apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: dact
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: airflow-init
          image: apache/airflow:2.10.3-python3.11
          envFrom:
            - secretRef:
                name: dact-secrets
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: requests==2.32.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              airflow db migrate
              airflow users create --username admin --password "$AIRFLOW_ADMIN_PASSWORD" \
                --firstname Admin --lastname User --role Admin --email admin@example.com || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: dact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      containers:
        - name: webserver
          image: apache/airflow:2.10.3-python3.11
          args: ["webserver"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: dact-secrets
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: BACKEND_URL
              value: http://backend:8000
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: requests==2.32.3
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/retraining_dag.py
              subPath: retraining_dag.py
            - name: dags
              mountPath: /opt/airflow/dags/joint_retrain_dag.py
              subPath: joint_retrain_dag.py
            - name: dags
              mountPath: /opt/airflow/dags/electricity_joint_dag.py
              subPath: electricity_joint_dag.py
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: dags
          configMap:
            name: airflow-dags
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: dact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      containers:
        - name: scheduler
          image: apache/airflow:2.10.3-python3.11
          args: ["scheduler"]
          envFrom:
            - secretRef:
                name: dact-secrets
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: BACKEND_URL
              value: http://backend:8000
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: requests==2.32.3
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags/retraining_dag.py
              subPath: retraining_dag.py
            - name: dags
              mountPath: /opt/airflow/dags/joint_retrain_dag.py
              subPath: joint_retrain_dag.py
            - name: dags
              mountPath: /opt/airflow/dags/electricity_joint_dag.py
              subPath: electricity_joint_dag.py
      volumes:
        - name: dags
          configMap:
            name: airflow-dags
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: dact
spec:
  type: NodePort
  selector:
    app: airflow-webserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30766
